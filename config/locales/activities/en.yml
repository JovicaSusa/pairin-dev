en:
  activities:
    sent_offer:
      titles:
        - Your Application Has Been Sent!
        - Application Sent! Let's See How They Respond!
        - Your Application Is on Its Way!
      content:
        - You've just applied to a partner search. We'll let you know when they answer.
        - Your application has been sent. Now it's time to see what comes next.
        - Your application is with the poster. Check back soon for their answer.
    received_offer:
      titles:
        - You've Got a New Application!
        - Someone Applied to Your Partner Search!
        - A New Application Is Waiting for You!
      content:
        - Someone wants to learn with you. Take a look at their application.
        - A new application has arrived. Don't keep them waiting!
        - Someone applied to your partner search. Take a moment to read what they wrote.
    offer_accepted:
      titles:
        - Great News! Your Application Was Accepted!
        - Your Application Was Accepted!
        - You've Got the Green Light!
      content:
        - Your application has been accepted. Time to get started!
        - The poster accepted your application. Let's move forward together!
        - Congratulations! Your application was accepted.
    offer_not_accepted:
      titles:
        - Your Application Wasn't Accepted This Time.
        - This Partner Search Went Another Way.
        - No Luck on This Application.
      content:
        - Your application wasn't accepted this time. There are other partner searches to try.
        - The poster went with someone else. Don't give up, someone else is looking too.
        - It didn't work out this time, but keep trying.
    pair_request_created:
      titles:
        - Your partner search is now live!
      content:
        - Thanks for keeping the community alive. Hope you'll hear from someone soon!
